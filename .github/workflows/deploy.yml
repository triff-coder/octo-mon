name: Deploy

# Deploys the Worker to Cloudflare on every push to main, so a merged PR
# goes live without anyone needing a terminal or wrangler installed
# locally. Also runnable on demand from the Actions tab (workflow_dispatch)
# for a manual redeploy without a new commit.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
